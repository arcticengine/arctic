# You can override the included template(s) by including variable overrides
# See https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#priority-of-environment-variables
include:
  - template: Security/License-Scanning.gitlab-ci.yml
image: silkeh/clang
stages:
- test
- deploy
- fuzz
.build_deps: &build_deps
  - apt-get update --yes
  - apt-get install --yes libasound2-dev libglu1-mesa-dev freeglut3-dev
    libglfw3-dev libgles2-mesa-dev xvfb
build_wizard:
  stage: test
  before_script: *build_deps
  script:
  - cd wizard
  - cmake .
  - make all
  - cmake -DCMAKE_BUILD_TYPE=Debug .
  - make all
  - cd ..
build_ap:
  stage: test
  before_script: *build_deps
  script:
  - cd antarctica_pyramids
  - cmake .
  - make all
  - xvfb-run ctest --output-on-failure
  - cmake -DCMAKE_BUILD_TYPE=Debug .
  - make all
  - xvfb-run ctest --output-on-failure
  - cd ..
build_benchmark:
  stage: test
  before_script: *build_deps
  script:
  - cd benchmark
  - cmake .
  - make all
  - cmake -DCMAKE_BUILD_TYPE=Debug .
  - make all
  - cd ..
build_headless_server:
  stage: test
  before_script: *build_deps
  script:
  - cd headless_server
  - cmake .
  - make all
  - ctest --output-on-failure
  - cmake -DCMAKE_BUILD_TYPE=Debug .
  - make all
  - ctest --output-on-failure
  - cd ..
build_tests:
  stage: test
  before_script: *build_deps
  script:
  - cd tests
  - cmake .
  - make all
  - cmake -DCMAKE_BUILD_TYPE=Debug .
  - make all
  - cd ..
run_tests:
  stage: test
  before_script: *build_deps
  script:
  - cd tests
  - cmake .
  - make all
  - xvfb-run ctest --output-on-failure
  - cmake -DCMAKE_BUILD_TYPE=Debug .
  - make all
  - xvfb-run ctest --output-on-failure
  - cd ..
# One project per template kind of wizard/main.cpp (kTemplateKinds), created
# with the console wizard and built. Keep the list in step with the wizard.
create_templates:
  stage: test
  before_script: *build_deps
  script:
  - cd wizard
  - cmake .
  - make all
  - cd ..
  - |
    for kind in tetramino hello snake kids conquest des cube gui; do
      ./wizard/wizard create test_${kind} --template ${kind} || exit 1
      (cd ../test_${kind} && cmake . && make all) || exit 1
    done
include:
- template: Coverage-Fuzzing.gitlab-ci.yml
- template: Security/SAST.gitlab-ci.yml
variables:
  SAST_EXCLUDED_ANALYZERS: "semgrep"
fuzz_wav:
  extends: ".fuzz_base"
  image: silkeh/clang
  variables:
    COVFUZZ_SEED_CORPUS: "./fuzz_tests/wav_corpus"
  script:
  - pwd
  - apt-get update -qq && apt-get install -y -qq git
  - apt-get install --yes libasound2-dev libglu1-mesa-dev freeglut3-dev
    libglfw3-dev libgles2-mesa-dev xvfb
  - export CC=`which clang`
  - export CXX=`which clang++`
  - export VERBOSE=1
  - mkdir fuzz_tests/wav_corpus && cp wizard/data/*.wav fuzz_tests/wav_corpus
  - mkdir -p build && cd build
  - cmake ../fuzz_tests -DCMAKE_CXX_FLAGS='-D_GLIBCXX_USE_CXX11_ABI=0' -DCMAKE_BUILD_TYPE=AddressSanitizer
    && make all && cd ..
  - "./gitlab-cov-fuzz run --regression=$REGRESSION -- ./build/fuzz_harness -max_total_time=600"
fuzz_csv:
  extends: ".fuzz_base"
  image: silkeh/clang
  variables:
    COVFUZZ_SEED_CORPUS: "./fuzz_tests/csv_corpus"
  script:
  - apt-get update -qq && apt-get install -y -qq git
  - apt-get install --yes libasound2-dev libglu1-mesa-dev freeglut3-dev
    libglfw3-dev libgles2-mesa-dev xvfb
  - export CC=`which clang`
  - export CXX=`which clang++`
  - export VERBOSE=1
  - mkdir fuzz_tests/csv_corpus && cp wizard/data/*.csv fuzz_tests/csv_corpus
  - mkdir -p build && cd build
  - TEST_NAME=fuzz_csv cmake ../fuzz_tests -DCMAKE_CXX_FLAGS='-D_GLIBCXX_USE_CXX11_ABI=0'
    -DCMAKE_BUILD_TYPE=AddressSanitizer && make all && cd ..
  - "./gitlab-cov-fuzz run --regression=$REGRESSION -- ./build/fuzz_csv -max_total_time=600"
fuzz_tga:
  extends: ".fuzz_base"
  image: silkeh/clang
  variables:
    COVFUZZ_SEED_CORPUS: "./fuzz_tests/tga_corpus"
  script:
  - apt-get update -qq && apt-get install -y -qq git
  - apt-get install --yes cmake clang libasound2-dev libglu1-mesa-dev freeglut3-dev
    libglfw3-dev libgles2-mesa-dev xvfb
  - export CC=`which clang`
  - export CXX=`which clang++`
  - export VERBOSE=1
  - mkdir fuzz_tests/tga_corpus && cp wizard/data/*.tga fuzz_tests/tga_corpus
  - mkdir -p build && cd build
  - TEST_NAME=fuzz_tga cmake ../fuzz_tests -DCMAKE_CXX_FLAGS='-D_GLIBCXX_USE_CXX11_ABI=0'
    -DCMAKE_BUILD_TYPE=AddressSanitizer && make all && cd ..
  - "./gitlab-cov-fuzz run --regression=$REGRESSION -- ./build/fuzz_tga -max_total_time=600"
pages:
  stage: deploy
  cache: {}
  image: php:7-cli-alpine
  before_script:
  - apk update
  - apk add doxygen ttf-freefont graphviz
  script:
  - cd doc
  - doxygen ./Doxyfile
  - mv ./html/ ../public/
  artifacts:
    paths:
    - public
  only:
  - master
sast:
  stage: test
